<!DOCTYPE html>
<html lang="ru">
<head>

<body data-page="rating">
  <main class="wrap">
    <section class="section">

    <section class="section">
      <h2 class="section-title"><span class="sakura">🌸</span> Средний балл по жанрам <span class="sakura">🌸</span></h2>
      <div class="grid" id="genre-chart" style="grid-template-columns:1fr;gap:16px"></div>
    </section>
  </main>

  <!-- РОВНО ОДИН скрипт, путь правильный -->
  <script src="js/script.js"></script>
