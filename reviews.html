<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Отзывы — KINO.SAKURA</title>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&family=Manrope:wght@400;600;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body data-page="reviews">
  <main class="wrap">
    <!-- Секция списка отзывов -->
    <section class="section">
      <div class="kicker" style="text-align:center">💬 МНЕНИЯ ЗРИТЕЛЕЙ</div>
      <h2 class="section-title"><span class="sakura">🌸</span> Все отзывы <span class="sakura">🌸</span></h2>
      <p class="section-sub mono" id="rev-count">Всего отзывов: 0</p>
      
      <div class="filters">
        <input id="rev-search" placeholder="🔍 поиск по тексту или автору..." style="width:min(280px,100%);background:rgba(10,14,29,.7);border:1px solid var(--line);border-radius:999px;padding:10px 18px">
        <select id="min-rating" style="background:rgba(10,14,29,.7);border:1px solid var(--line);border-radius:999px;padding:10px 16px">
          <option value="1">любая оценка</option>
          <option value="7">от 7 ★</option>
          <option value="9">от 9 ★</option>
        </select>
      </div>
      
      <!-- Сюда скрипт вставит карточки отзывов -->
      <div id="all-reviews"></div>
    </section>

    <!-- Секция добавления отзыва -->
    <section class="section">
      <h2 class="section-title"><span class="sakura">🌸</span> Написать отзыв <span class="sakura">🌸</span></h2>
      <form id="add-form" class="card form-card">
        <div class="field">
          <label>Выбери фильм</label>
          <select id="movie-select" required></select>
        </div>
        <div class="field">
          <label>Твоя оценка: <span class="range-val" id="a-val">8</span>/10</label>
          <input type="range" id="a-rating" min="1" max="10" value="8" style="width:100%">
        </div>
        <div class="field">
          <label>Текст отзыва</label>
          <textarea id="a-text" required placeholder="Поделись мнением о фильме..."></textarea>
        </div>
        <button class="btn" type="submit">💖 опубликовать</button>
      </form>
    </section>
  </main>

  <script src="js/script.js"></script>
</body>
</html>
