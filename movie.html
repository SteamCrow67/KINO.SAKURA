<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Фильм — KINO.SAKURA</title>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&family=Manrope:wght@400;600;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body data-page="movies">
  <main class="wrap">
    <section class="section detail" id="detail"></section>

    <section class="section">
      <h2 class="section-title" id="rev-title"></h2>
      <div class="grid" id="rev-list" style="grid-template-columns:repeat(auto-fill,minmax(300px,1fr))"></div>
    </section>

   <section class="section">
  <h2 class="section-title"><span class="sakura">🌸</span> Оставить отзыв <span class="sakura">🌸</span></h2>
  <div class="card">
    <form id="rev-form">
      <div class="field">
  <label>Твоя оценка: <span id="r-val" class="mono" style="color:var(--pink)">8</span>/10</label>
  <input type="range" id="r-rating" min="1" max="10" value="8" step="1">
</div>
<div class="field">
  <label>Текст отзыва</label>
  <textarea id="r-text" rows="5" placeholder="Что зацепило? Что бы ты изменил(а)?"></textarea>
</div>
<button type="submit" class="btn primary">💖 опубликовать</button>
    </form>
  </div>

  <h3 id="rev-title" class="mono" style="margin-top:40px;font-size:1.1rem;color:var(--pink2)">Отзывы (0)</h3>
  <div id="rev-list"></div>
</section>
  </main>
  <script src="js/main.js"></script>
  <script src="js/movie.js"></script>
</body>
</html>
